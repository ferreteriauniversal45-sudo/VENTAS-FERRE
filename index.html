<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ferretería Universal - Cotizaciones</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login" class="login-bg">
  <div class="login-card">

    <img
      src="https://raw.githubusercontent.com/ferreteriauniversal45-sudo/ferreteria-inventario-app/main/logo.png"
      alt="Ferretería Universal"
      class="logo-login"
    />

    <h1>Acceso</h1>
    <p id="roleText">Selecciona un rol</p>

    <div id="roles">
      <button type="button" onclick="selectRole('OPERADOR')">👷 OPERADOR</button>
      <button type="button" onclick="selectRole('VENDEDOR')">🧾 VENDEDOR</button>
      <button type="button" onclick="selectRole('ADMIN')">⚙️ ADMINISTRADOR</button>
    </div>

    <div id="pinBox" class="hidden">
      <input type="password" id="pin" placeholder="Ingresa tu PIN" />
      <button type="button" onclick="validatePin()">Entrar</button>
      <button type="button" class="secondary" onclick="resetLogin()">⬅ Cambiar rol</button>
      <div id="pinError" class="pin-error hidden">❌ PIN incorrecto</div>
    </div>

  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <header class="app-header">
    <div class="header-left">
      <img
        src="https://raw.githubusercontent.com/ferreteriauniversal45-sudo/ferreteria-inventario-app/main/logo.png"
        class="logo-header"
        alt="Ferretería Universal"
      />
      <div class="header-text">
        <h1 id="headerTitle">Cotizaciones</h1>
        <small id="headerSubtitle">Ferretería Universal</small>
      </div>
    </div>

    <button class="danger small" type="button" onclick="logout()">Salir</button>
  </header>

  <main>
    <!-- HOME VENDEDOR -->
    <div id="vendedorHome" class="hidden">
      <button type="button" onclick="abrirCotizacion()">🧾 Nueva Cotización</button>
      <button type="button" onclick="abrirClientes()">👤 Clientes</button>
      <button type="button" class="secondary" onclick="abrirHistorialCotizaciones()">📑 Cotizaciones guardadas</button>
    </div>

    <!-- CONTENIDO DINÁMICO -->
    <div id="contenido" class="hidden"></div>
  </main>
</div>

<!-- ================= MODAL NOMBRE VENDEDOR ================= -->
<div id="modalVendedor" class="modal">
  <div class="modal-card">
    <img
      src="https://raw.githubusercontent.com/ferreteriauniversal45-sudo/ferreteria-inventario-app/main/logo.png"
      class="logo-login"
      alt="Ferretería Universal"
    />
    <h3>Nombre del vendedor</h3>
    <p class="note">Se usará en las cotizaciones (PDF)</p>

    <input id="nombreVendedorInput" placeholder="Ej: Juan Pérez" />

    <button type="button" onclick="guardarNombreVendedor()">Guardar</button>
    <button type="button" class="secondary" onclick="cerrarModalVendedor()">Cancelar</button>
  </div>
</div>

<!-- ================= MODAL CLIENTES (SELECCIONAR / BUSCAR) ================= -->
<div id="modalClientes" class="modal">
  <div class="modal-card">
    <h3>Seleccionar cliente</h3>
    <p class="note">Busca por nombre o empresa, o crea uno nuevo.</p>

    <input id="buscarClienteInput" placeholder="🔍 Buscar cliente..." />

    <div id="listaClientesModal" class="list-scroll"></div>

    <hr />

    <button type="button" onclick="abrirModalNuevoCliente()">➕ Agregar cliente nuevo</button>
    <button type="button" class="secondary" onclick="cerrarModalClientes()">Cancelar</button>
  </div>
</div>

<!-- ================= MODAL NUEVO CLIENTE ================= -->
<div id="modalNuevoCliente" class="modal">
  <div class="modal-card">
    <h3>Nuevo cliente</h3>
    <p class="note">Todos los campos son opcionales.</p>

    <input id="ncNombre" placeholder="Nombre del cliente" />
    <input id="ncEmpresa" placeholder="Empresa" />
    <input id="ncTelefono" placeholder="Teléfono" />
    <input id="ncRTN" placeholder="RTN" />
    <input id="ncUbicacion" placeholder="Ubicación" />

    <button type="button" onclick="guardarClienteDesdeModal()">Guardar cliente</button>
    <button type="button" class="secondary" onclick="cerrarModalNuevoCliente(true)">Cancelar</button>
  </div>
</div>

<!-- ================= MODAL PRODUCTO (CANTIDAD + PRECIO) ================= -->
<div id="modalProducto" class="modal">
  <div class="modal-card">
    <h3 id="mpNombre">Producto</h3>
    <div id="mpMeta" class="note"></div>

    <div id="mpListaPrecios" class="price-table"></div>

    <label><b>Cantidad</b></label>
    <input id="mpCantidad" type="number" min="1" value="1" />

    <label><b>Tipo de precio</b></label>
    <select id="mpTipoPrecio"></select>

    <div id="mpPrecioManualWrap" class="hidden">
      <label><b>PRECIO VENDEDOR</b></label>
      <input id="mpPrecioValor" type="number" min="0" step="0.01" placeholder="Ej: 1250.00" />
    </div>

    <div class="total-box small-total">
      <span>Total línea</span>
      <span id="mpTotalLinea">L. 0.00</span>
    </div>

    <div class="btn-row">
      <button type="button" onclick="confirmarAgregarProducto()">Agregar</button>
      <button type="button" class="secondary" onclick="cerrarModalProducto()">Cancelar</button>
    </div>
  </div>
</div>

<!-- jsPDF (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="app.js"></script>
</body>
</html>
